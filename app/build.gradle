apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// GitHub Actions passes -PbuildVersionCode / -PbuildVersionName so each
// pushed build increments automatically. Falls back to 1 / "1.0" for a
// local build with no properties passed in.
def ciVersionCode = project.hasProperty('buildVersionCode') ? (project.buildVersionCode as Integer) : 1
def ciVersionName = project.hasProperty('buildVersionName') ? project.buildVersionName : "1.0"

android {
    namespace 'com.allen.wanderersgrimoire'
    compileSdk 34

    defaultConfig {
        applicationId "com.allen.wanderersgrimoire"
        minSdk 24
        targetSdk 34
        versionCode ciVersionCode
        versionName ciVersionName
    }

    signingConfigs {
        debug {
            // Committed on purpose: a fixed debug keystore means every CI
            // build is signed identically, so a new APK installs as an
            // update over the old one instead of Android refusing it as
            // "different signature" and forcing an uninstall first. Debug
            // keys aren't meant to be secret, this one is only ever used
            // for sideloaded personal builds, never Play Store.
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

